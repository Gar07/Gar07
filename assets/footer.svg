<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- back wave (slow) -->
  <path d="M0 70 Q250 20 500 70 T1000 70 T1500 70 T2000 70 V140 H0 Z" fill="url(#w)" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="18s" repeatCount="indefinite"/>
  </path>
  <!-- middle wave -->
  <path d="M0 85 Q250 40 500 85 T1000 85 T1500 85 T2000 85 V140 H0 Z" fill="url(#w)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <!-- front wave (fast) -->
  <path d="M0 100 Q250 65 500 100 T1000 100 T1500 100 T2000 100 V140 H0 Z" fill="url(#w)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="8s" repeatCount="indefinite"/>
  </path>

  <text x="500" y="128" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#ffffff" opacity="0.9">thanks for stopping by · happy hacking</text>
</svg>
