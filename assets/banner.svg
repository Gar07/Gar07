<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Gar07 - Gilbert Aldrich Rumahorbo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#131a3b"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#818cf8;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07"/>
    </pattern>

    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>

    <!-- typing reveal clips: each line types in, holds, then erases; lines chain one after another -->
    <clipPath id="c1"><rect x="84" y="188" height="38" width="0">
      <animate id="a1" attributeName="width" values="0;360;360;0" keyTimes="0;0.4;0.92;1" calcMode="linear" dur="4s" begin="0.5s;a4.end"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="84" y="188" height="38" width="0">
      <animate id="a2" attributeName="width" values="0;520;520;0" keyTimes="0;0.4;0.92;1" calcMode="linear" dur="4s" begin="a1.end"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="84" y="188" height="38" width="0">
      <animate id="a3" attributeName="width" values="0;535;535;0" keyTimes="0;0.4;0.92;1" calcMode="linear" dur="4s" begin="a2.end"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="84" y="188" height="38" width="0">
      <animate id="a4" attributeName="width" values="0;405;405;0" keyTimes="0;0.4;0.92;1" calcMode="linear" dur="4s" begin="a3.end"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- drifting glow blobs -->
    <circle cx="140" cy="60" r="110" fill="#38bdf8" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 25;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="230" r="130" fill="#ec4899" opacity="0.09">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 -20;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="420" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="85" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="35" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="250" r="1.3"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="40" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="240" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- scan line -->
    <rect x="0" y="-4" width="1000" height="3" fill="#38bdf8" opacity="0.12">
      <animate attributeName="y" values="-4;284" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- orbit rings (right side) -->
    <g transform="translate(850 140)">
      <circle r="100" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="72" fill="none" stroke="#818cf8" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="30 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="46" fill="none" stroke="#ec4899" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <g>
        <circle r="5" cx="100" cy="0" fill="#38bdf8" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </g>
      <text text-anchor="middle" y="11" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="32" font-weight="700" fill="url(#title)" filter="url(#glow)">07</text>
    </g>

    <!-- text block -->
    <text x="62" y="62" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#64748b">// medan · north sumatra · indonesia</text>

    <text x="58" y="136" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" fill="url(#title)" filter="url(#glow)">Gar2007</text>

    <text x="62" y="170" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" letter-spacing="3" fill="#cbd5e1">GILBERT ALDRICH RUMAHORBO</text>

    <!-- prompt + typing lines -->
    <text x="62" y="214" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="22" font-weight="700" fill="#10b981">&gt;
      <animate attributeName="opacity" values="1;1;0.25;1" keyTimes="0;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="22" font-weight="600" fill="#38bdf8">
      <g clip-path="url(#c1)"><text x="86" y="214">Computer Science @ Unimed</text></g>
      <g clip-path="url(#c2)"><text x="86" y="214">Building autonomous AI architectures</text></g>
      <g clip-path="url(#c3)"><text x="86" y="214">Hunting vulnerabilities | CTF | OSINT</text></g>
      <g clip-path="url(#c4)"><text x="86" y="214">Full-stack systems that ship</text></g>
    </g>

    <!-- bottom accent bar -->
    <rect x="0" y="274" width="1000" height="6" fill="url(#title)"/>
  </g>
</svg>
