name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day, 00:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # If the cards are incomplete or you get "Resource not accessible by integration",
          # create a Personal Access Token, save it as a repo secret named SUMMARY_GITHUB_TOKEN,
          # and use ${{ secrets.SUMMARY_GITHUB_TOKEN }} here instead.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main" # change to "master" if your profile repo uses master
          UTC_OFFSET: 7 # WIB
